<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telemetría y Control - Robot Seguidor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    
    .card { background: #1e293b; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 1px solid #334155; }
    .header { text-align: center; }
    .header h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; margin-top: 8px; }
    .status-connected { background: #064e3b; color: #34d399; }
    .status-disconnected { background: #7f1d1d; color: #f87171; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-connected { background: #10b981; }
    .dot-disconnected { background: #ef4444; }

    /* Visualización Sensores */
    .sensors-container { display: flex; justify-content: space-between; gap: 8px; margin: 12px 0; }
    .sensor-box { flex: 1; height: 48px; border-radius: 8px; border: 2px solid #475569; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; transition: all 0.15s ease; background: #0f172a; color: #64748b; }
    .sensor-box.active { background: #38bdf8; color: #0f172a; border-color: #7dd3fc; box-shadow: 0 0 12px #38bdf8; }

    /* Métricas */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .metric-card { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    .metric-label { font-size: 0.75rem; color: #94a3b8; }
    .metric-value { font-size: 1.2rem; font-weight: 700; color: #f1f5f9; margin-top: 2px; }

    /* Sliders de Control */
    .control-group { margin-bottom: 14px; }
    .control-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .control-label span:last-child { color: #38bdf8; font-family: monospace; }
    input[type=range] { width: 100%; height: 6px; border-radius: 3px; background: #334155; outline: none; -webkit-appearance: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #38bdf8; cursor: pointer; border: 2px solid #0f172a; }

    .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; margin-top: 6px; }
    .btn:active { background: #0369a1; transform: scale(0.98); }
    .btn-auto { background: #334155; margin-top: 8px; font-size: 0.8rem; padding: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card header">
      <h1>Robot Seguidor de Línea</h1>
      <div id="status" class="status-badge status-disconnected">
        <span class="dot dot-disconnected" id="dot"></span>
        <span id="status-text">Desconectado (ws://192.168.4.1:81)</span>
      </div>
    </div>

    <!-- Sensores en vivo -->
    <div class="card">
      <div style="font-size: 0.85rem; color: #94a3b8; font-weight: 600; margin-bottom: 4px;">SENSORES ÓPTICOS</div>
      <div class="sensors-container">
        <div class="sensor-box" id="s0">S1</div>
        <div class="sensor-box" id="s1">S2</div>
        <div class="sensor-box" id="s2">S3</div>
        <div class="sensor-box" id="s3">S4</div>
        <div class="sensor-box" id="s4">S5</div>
      </div>
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Error Calculado</div>
          <div class="metric-value" id="val-error">0.00</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Salida PID</div>
          <div class="metric-value" id="val-pid">0.00</div>
        </div>
      </div>
    </div>

    <!-- Panel de Calibración en Vivo -->
    <div class="card">
      <div style="font-size: 0.85rem; color: #94a3b8; font-weight: 600; margin-bottom: 12px;">CALIBRACIÓN PID EN VIVO</div>
      
      <div class="control-group">
        <div class="control-label">
          <span>Constante Proporcional (Kp)</span>
          <span id="lbl-kp">35.0</span>
        </div>
        <input type="range" id="input-kp" min="0" max="150" step="0.5" value="35.0" oninput="actualizarLabel('kp', this.value)">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Constante Integral (Ki)</span>
          <span id="lbl-ki">0.0</span>
        </div>
        <input type="range" id="input-ki" min="0" max="10" step="0.05" value="0.0" oninput="actualizarLabel('ki', this.value)">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Constante Derivativa (Kd)</span>
          <span id="lbl-kd">25.0</span>
        </div>
        <input type="range" id="input-kd" min="0" max="100" step="0.5" value="25.0" oninput="actualizarLabel('kd', this.value)">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Velocidad Base (PWM)</span>
          <span id="lbl-speed">130</span>
        </div>
        <input type="range" id="input-speed" min="50" max="255" step="5" value="130" oninput="actualizarLabel('speed', this.value)">
      </div>

      <button class="btn" onclick="enviarParametros()">ENVIAR AL ROBOT</button>
      <button class="btn btn-auto" id="btn-reconnect" onclick="conectarWebSocket()">RECONECTAR WEBSOCKET</button>
    </div>
  </div>

  <script>
    let socket = null;
    const wsUrl = "ws://192.168.4.1:81/";

    function actualizarLabel(id, val) {
      document.getElementById('lbl-' + id).innerText = val;
    }

    function conectarWebSocket() {
      const statusBadge = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const dot = document.getElementById("dot");

      statusText.innerText = "Conectando...";

      try {
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          statusBadge.className = "status-badge status-connected";
          dot.className = "dot dot-connected";
          statusText.innerText = "Conectado al Robot";
        };

        socket.onclose = () => {
          statusBadge.className = "status-badge status-disconnected";
          dot.className = "dot dot-disconnected";
          statusText.innerText = "Desconectado";
          setTimeout(conectarWebSocket, 2000); // Reintento automático
        };

        socket.onerror = (err) => {
          socket.close();
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.sensores && Array.isArray(data.sensores)) {
              for (let i = 0; i < 5; i++) {
                const el = document.getElementById('s' + i);
                if (data.sensores[i] === 1) {
                  el.classList.add('active');
                } else {
                  el.classList.remove('active');
                }
              }
            }
            if (data.error !== undefined) {
              document.getElementById('val-error').innerText = Number(data.error).toFixed(2);
            }
            if (data.PID !== undefined) {
              document.getElementById('val-pid').innerText = Number(data.PID).toFixed(1);
            }
          } catch(e) {}
        };
      } catch (err) {
        statusText.innerText = "Error de conexión";
      }
    }

    function enviarParametros() {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        alert("El robot no está conectado por WebSocket.");
        return;
      }
      const config = {
        Kp: parseFloat(document.getElementById('input-kp').value),
        Ki: parseFloat(document.getElementById('input-ki').value),
        Kd: parseFloat(document.getElementById('input-kd').value),
        baseSpeed: parseInt(document.getElementById('input-speed').value)
      };
      socket.send(JSON.stringify(config));
    }

    window.addEventListener("load", conectarWebSocket);
  </script>
</body>
</html>
